name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Docker
        run: docker info
      - name: Restore
        run: dotnet restore ProspectionCrm.slnx
      - name: Build
        run: dotnet build ProspectionCrm.slnx --configuration Release --no-restore
      - name: Test
        run: >-
          dotnet test ProspectionCrm.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=ProspectionCrm.Tests.trx"
          --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14
